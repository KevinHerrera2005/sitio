<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/normallize.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="indice contenedor">
        <a class="logo" href="index.html">
          <h1 class="logo__nombre no-margin centrar-texto">
            Blog<span class="logo__bold">DeCafe</span>
          </h1>
        </a>
        <nav class="links">
          <a href="nosotros.html">Nosotros</a>
          <a href="cursos.html">Cursos</a>
          <a href="contacto.html">Contacto</a>
        </nav>
      </div>

      <section class="sub-indice">
        <h2 class="no-margin">blog de cafe con consejos y cursos</h2>
        <p class="no-margin">
          aprende de los expertsos con las mejores recetas y consejos
        </p>
      </section>
    </header>

    <main class="contenedor">
        <h3 class="centrar-texto">contacto</h3>
        <div class="contacto-bg"></div>

        <form class="formulario">
            <div class="campo">
                <label class="campo__label" for="nombre">Nombre:</label>
                <input class="campo__field" type="text" placeholder="Tu nombre" id="nombre">
            </div>


            <div class="campo">
                <label  class="campo__label" for="email">E-mail:</label>
                <input  class="campo__field" type="email" placeholder="Tu email" id="email">
            </div>


            <div class="campo">
                <label class="campo__label" for="mensaje">Mensaje:</label>
                <textarea class="campo__field--textarea" id="mensaje"></textarea>
            </div>


            <div class="campo">
                <button  type="button" class="contenido__subtitulo__boton--contacto" >Enviar</button>
            </div>


        </form>
      
    </main>



    <footer>
      <div class="indice contenedor">
        <a class="logo" href="index.html">
          <h1 class="logo__nombre no-margin centrar-texto">
            Blog<span class="logo__bold">DeCafe</span>
          </h1>
        </a>
        <nav class="links">
          <a href="nosotros.html">Nosotros</a>
          <a href="cursos.html">Cursos</a>
          <a href="contacto.html">Contacto</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
